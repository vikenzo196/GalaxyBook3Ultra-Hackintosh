# S0ixSleep configuration, read by s0ix-arm.sh at boot (copy to /usr/local/etc/s0ixsleep.conf).

# How the CPU waits between checks for a wake event (with 1 and 2 the core also runs at its lowest HWP level):
# 2 = MWAIT C10, woken by the local APIC timer every PERIOD ms. The package can reach its idle states.
#     Needs MWAIT, the TSC deadline timer and ARAT; if the CPU lacks one, the daemon falls back to 1.
# 1 = TPAUSE C0.2 for ~1 ms at a time. Simpler, but the package stays in PC0 (more power).
# 0 = plain PAUSE loop (only for debugging).
WAIT=2
# Wait 2: timer period in ms (5-1000). Up to this much extra delay before a wake event is noticed.
PERIOD=50

# Wake in the dark (display off, back to sleep after ~20 s) after N seconds of sleep, so that the battery
# guard below can run during a long sleep (0 = never). With ~5 W of sleep power a battery loses ~8 % per hour.
SAFETY=3600

# Battery guard (daemon): on battery, clean shutdown at or below these charges (%), a few seconds after a
# wake from sleep, or at any time while awake. Set to 0 to disable.
LOW_BATTERY_SLEEP=10
LOW_BATTERY_AWAKE=4

# Bag guard (daemon): after a wake from sleep, if nobody touches the keyboard or trackpad and the display is
# off for this many seconds, go back to sleep (0 = off).
BAG_GUARD=60

# Network interfaces taken down while the lid is closed and no display is on (asleep, or about to), back up when
# the lid opens or a display turns on. Example: SLEEP_IF_DOWN=en0 (itlwm keeps the Wi-Fi card active through
# sleep, about 1 W). Empty = off.
SLEEP_IF_DOWN=

# 1 = after a wake, run the firmware's _Qxx methods of the EC events that were ignored during the sleep, so
# that macOS sees battery and AC changes at once.
EC_REPLAY=1

# 1 = reset the Intel GT (render engine) before returning. Only for Intel Gen12+ (Tiger Lake and newer)
# graphics whose driver hangs after wake because it expects a GPU that lost power. Leave 0 otherwise.
GT_RESET=0

# Embedded controller events (hex, comma separated; the numbers of the firmware's _Qxx methods).
# Every EC event wakes the machine unless filtered. Sleep, wake, then read the last events with
#   sysctl debug.s0ix.stat   (ec_q=newest,...)
# EC_IGNORE: these events do not wake (battery, AC, thermal, fans...).
# EC_WAKE:   only these events wake (lid, power button, keyboard...); overrides EC_IGNORE.
EC_IGNORE=51,52,53,54,57,58,5b,60,61,65,66,72,73,74,75,76,7c
EC_WAKE=
